<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Paradox Lights</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Paradox Lights</h1>
    <span id="mqtt-badge" class="badge badge-off">MQTT</span>
  </header>

  <main>
    <!-- Light control -->
    <section>
      <h2>Lights</h2>

      <div class="light-preview">
        <div class="swatch-row">
          <div class="swatch-col">
            <div id="swatch-white" title="White channel"></div>
            <span class="swatch-label">W</span>
          </div>
          <span class="swatch-op">+</span>
          <div class="swatch-col">
            <div id="swatch-rgb" title="RGB channels"></div>
            <span class="swatch-label">RGB</span>
          </div>
          <span class="swatch-op">=</span>
          <div class="swatch-col">
            <div id="swatch-blend" title="Combined (approx)"></div>
            <span class="swatch-label">~</span>
          </div>
          <span class="swatch-sep">|</span>
          <div class="swatch-col">
            <div id="swatch-uv" title="UV channel"></div>
            <span class="swatch-label">UV</span>
          </div>
        </div>
        <div class="light-meta">
          <span id="light-state-label">—</span>
          <span id="light-scene-label" class="dim-text"></span>
        </div>
      </div>

      <div class="btn-row">
        <button type="button" id="btn-main">Main: —</button>
        <button type="button" id="btn-white">White: —</button>
        <button type="button" id="btn-uv">UV: OFF</button>
        <button type="button" id="btn-identify">Identify</button>
      </div>

      <h3>Scenes</h3>
      <div class="scene-grid" id="scene-grid">
        <button data-scene="white">White</button>
        <button data-scene="brightWhite">Bright White</button>
        <button data-scene="warmWhite">Warm</button>
        <button data-scene="softWhite">Soft</button>
        <button data-scene="dim">Dim</button>
        <button data-scene="nightLight" style="--sc:#600840">Night Light</button>
        <button data-scene="red" style="--sc:#f00">Red</button>
        <button data-scene="green" style="--sc:#0f0">Green</button>
        <button data-scene="blue" style="--sc:#00f">Blue</button>
        <button data-scene="yellow" style="--sc:#ff0">Yellow</button>
        <button data-scene="orange" style="--sc:#f80">Orange</button>
        <button data-scene="cyan" style="--sc:#0ff">Cyan</button>
        <button data-scene="magenta" style="--sc:#f0f">Magenta</button>
        <button data-scene="purple" style="--sc:#80f">Purple</button>
      </div>

      <h3>RGB</h3>
      <div class="slider-group">
        <label>R <input type="range" id="sl-r" min="0" max="255" value="0" /></label>
        <label>G <input type="range" id="sl-g" min="0" max="255" value="0" /></label>
        <label>B <input type="range" id="sl-b" min="0" max="255" value="0" /></label>
        <label>Brightness <input type="range" id="sl-bright" min="0" max="100" value="100" /></label>
      </div>
      <div class="btn-row">
        <button type="button" id="btn-apply-rgb">Apply RGB</button>
      </div>

      <h3>UV</h3>
      <div class="slider-group">
        <label>Brightness <input type="range" id="sl-uv" min="0" max="255" value="0" /></label>
      </div>
      <div class="btn-row">
        <button type="button" id="btn-apply-uv">Apply UV</button>
      </div>
    </section>

    <!-- Device status -->
    <section>
      <h2>Device</h2>
      <table id="status-table">
        <tbody>
          <tr><th>Name</th><td id="prop-name">—</td></tr>
          <tr><th>Firmware</th><td id="fw-version">—</td></tr>
          <tr><th>AP IP</th><td id="ap-ip">—</td></tr>
          <tr><th>LAN IP</th><td id="sta-ip">—</td></tr>
          <tr><th>Network</th><td id="sta-ssid">—</td></tr>
          <tr><th>RSSI</th><td><span id="sta-rssi">—</span> <span id="wifi-strength" class="wifi-bars"><span></span><span></span><span></span><span></span></span></td></tr>
          <tr><th>mDNS</th><td id="mdns">—</td></tr>
          <tr><th>MQTT</th><td id="mqtt-broker">—</td></tr>
          <tr><th>Topic</th><td id="mqtt-topic">—</td></tr>
          <tr><th>Uptime</th><td id="uptime">—</td></tr>
          <tr><th>Free heap</th><td id="free-heap">—</td></tr>
          <tr><th>Default Fade</th><td id="fade-time">—</td></tr>
        </tbody>
      </table>

      <div class="btn-row">
        <button type="button" id="refresh">Refresh</button>
        <button type="button" id="restart" class="warn">Restart</button>
        <button type="button" id="reset" class="danger">Factory Reset</button>
      </div>
      <p id="msg" class="msg hidden"></p>
    </section>
    <!-- Settings -->
    <section id="settings-section">
      <div id="settings-toggle" class="section-header">
        <h2>⚙ Settings</h2><span id="settings-chevron">▶</span>
      </div>
      <div id="settings-body" class="hidden">
        <p id="cfg-msg" class="msg hidden"></p>

        <h3>WiFi</h3>
        <div class="field-group">
          <div class="field">
            <label for="cfg-ssid">SSID</label>
            <div class="input-row">
              <input type="text" id="cfg-ssid" placeholder="network name" autocomplete="off" />
              <button type="button" id="btn-scan">⟳ Scan</button>
            </div>
            <ul id="scan-list" class="scan-list hidden"></ul>
          </div>
          <div class="field">
            <label for="cfg-wifi-pass">WiFi Password</label>
            <input type="password" id="cfg-wifi-pass" placeholder="(leave blank to keep current)" autocomplete="off" />
          </div>
        </div>

        <h3>Device</h3>
        <div class="field-group">
          <div class="field">
            <label for="cfg-hostname">Hostname</label>
            <input type="text" id="cfg-hostname" placeholder="px-light-xxxx" autocomplete="off" />
            <span class="field-hint">AP SSID &amp; mDNS: <strong id="hostname-preview">—</strong>.local</span>
          </div>
        </div>

        <h3>MQTT</h3>
        <div class="field-group">
          <div class="field">
            <label for="cfg-mqtt-host">Broker</label>
            <input type="text" id="cfg-mqtt-host" placeholder="broker.local" />
          </div>
          <div class="field field-inline">
            <label for="cfg-mqtt-port">Port</label>
            <input type="number" id="cfg-mqtt-port" value="1883" min="1" max="65535" />
          </div>
          <div class="field">
            <label for="cfg-mqtt-user">Username</label>
            <input type="text" id="cfg-mqtt-user" placeholder="(optional)" autocomplete="off" />
          </div>
          <div class="field">
            <label for="cfg-mqtt-pass">Password</label>
            <input type="password" id="cfg-mqtt-pass" placeholder="(leave blank to keep current)" autocomplete="off" />
          </div>
          <div class="field">
            <label for="cfg-base-topic">Base Topic</label>
            <input type="text" id="cfg-base-topic" placeholder="paradox/lights/px-light-xxxx" />
          </div>
        </div>

        <h3>Light</h3>
        <div class="field-group">
          <div class="field field-inline">
            <label for="cfg-fade-time">Default Fade Time (s)</label>
            <input type="number" id="cfg-fade-time" value="1.0" min="0" max="60" step="0.1" />
          </div>
        </div>
        <div class="btn-row">
          <button type="button" id="btn-save-fade">Save Fade Time</button>
        </div>

        <div class="btn-row">
          <button type="button" id="btn-save-cfg">Save Settings</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
