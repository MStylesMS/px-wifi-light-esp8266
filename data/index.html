<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Paradox Lights</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Paradox Lights</h1>
    <span id="mqtt-badge" class="badge badge-off">MQTT</span>
  </header>

  <main>
    <!-- Light control -->
    <section>
      <h2>Lights</h2>

      <div class="light-preview">
        <div id="color-swatch"></div>
        <div class="light-meta">
          <span id="light-state-label">—</span>
          <span id="light-scene-label" class="dim-text"></span>
        </div>
      </div>

      <div class="btn-row">
        <button type="button" id="btn-on">On</button>
        <button type="button" id="btn-off" class="warn">Off</button>
        <button type="button" id="btn-identify">Identify</button>
      </div>

      <h3>Scenes</h3>
      <div class="scene-grid" id="scene-grid">
        <button data-scene="white">White</button>
        <button data-scene="warmWhite">Warm</button>
        <button data-scene="softWhite">Soft</button>
        <button data-scene="dim">Dim</button>
        <button data-scene="red" style="--sc:#f00">Red</button>
        <button data-scene="green" style="--sc:#0f0">Green</button>
        <button data-scene="blue" style="--sc:#00f">Blue</button>
        <button data-scene="yellow" style="--sc:#ff0">Yellow</button>
        <button data-scene="orange" style="--sc:#f80">Orange</button>
        <button data-scene="cyan" style="--sc:#0ff">Cyan</button>
        <button data-scene="magenta" style="--sc:#f0f">Magenta</button>
        <button data-scene="purple" style="--sc:#80f">Purple</button>
      </div>

      <h3>RGB</h3>
      <div class="slider-group">
        <label>R <input type="range" id="sl-r" min="0" max="255" value="0" /></label>
        <label>G <input type="range" id="sl-g" min="0" max="255" value="0" /></label>
        <label>B <input type="range" id="sl-b" min="0" max="255" value="0" /></label>
        <label>Brightness <input type="range" id="sl-bright" min="0" max="100" value="100" /></label>
      </div>
      <div class="btn-row">
        <button type="button" id="btn-apply-rgb">Apply RGB</button>
      </div>
    </section>

    <!-- Device status -->
    <section>
      <h2>Device</h2>
      <table id="status-table">
        <tbody>
          <tr><th>Name</th><td id="prop-name">—</td></tr>
          <tr><th>Firmware</th><td id="fw-version">—</td></tr>
          <tr><th>AP IP</th><td id="ap-ip">—</td></tr>
          <tr><th>LAN IP</th><td id="sta-ip">—</td></tr>
          <tr><th>Network</th><td id="sta-ssid">—</td></tr>
          <tr><th>RSSI</th><td id="sta-rssi">—</td></tr>
          <tr><th>mDNS</th><td id="mdns">—</td></tr>
          <tr><th>Uptime</th><td id="uptime">—</td></tr>
          <tr><th>Free heap</th><td id="free-heap">—</td></tr>
        </tbody>
      </table>

      <div class="btn-row">
        <button type="button" id="refresh">Refresh</button>
        <button type="button" id="restart" class="warn">Restart</button>
        <button type="button" id="reset" class="danger">Factory Reset</button>
      </div>
      <p id="msg" class="msg hidden"></p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
