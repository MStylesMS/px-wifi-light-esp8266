; px-wifi-light-esp8266 — PlatformIO project configuration
; Target hardware: LoLin NodeMCU V3 (30-pin, ESP12F, CH340 USB)

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
; nodemcuv2 covers LoLin V3 — identical ESP12F GPIO mapping, only physical
; form-factor (30 pins vs 22+power) and USB-serial chip differ.
board = nodemcuv2
framework = arduino

monitor_speed   = 115200
upload_speed    = 115200
monitor_filters = esp8266_exception_decoder

board_build.filesystem = littlefs

lib_ldf_mode = deep+

build_flags =
    -D MQTT_MAX_PACKET_SIZE=1024
    -D MQTT_KEEPALIVE=30
    -D FW_VERSION=\"0.4.0\"
    -D ATOMIC_FS_UPDATE
    -D BEARSSL_SSL_BASIC

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8
    ; ESP8266mDNS, ESP8266WebServer, ESP8266HTTPUpdateServer, ArduinoOTA,
    ; LittleFS, ESP8266WiFi, ESP8266WiFiMulti are bundled with the platform core.

; OTA upload environment — connect your PC to the device AP first.
; Set upload_port to the device IP (192.168.4.1 if connected to its AP,
; or its LAN IP if it joined your network).
; If the old firmware had an OTA password, add: upload_flags = --auth=PASSWORD
[env:ota]
extends          = env:nodemcuv2
upload_protocol  = espota
upload_port      = 192.168.4.1

[env:native]
platform = native
test_framework = unity
test_build_src = false

build_flags =
    -D ARDUINOJSON_ENABLE_STD_STRING=1
    -D FW_VERSION=\"host-test\"
    -I test/stubs

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
